name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install binutils, gcc and qemu
        run: sudo apt-get update && sudo apt-get install -y binutils gcc qemu-system-x86
      - name: Generated files are current
        run: |
          python3 Tools/gen_runtime.py --check
          python3 Tools/gen_kinds.py --check
          python3 Tools/gen_builtins.py --check
          python3 Tools/gen_version.py --check
      - name: Builtin and runtime contracts
        run: |
          python3 Tests/builtins_test.py
          python3 Tests/runtime_test.py
          python3 Tests/freestanding_test.py
          python3 Tests/machine_builtins_test.py
      - name: Compiler suites
        run: |
          python3 Tests/version_test.py
          python3 Tests/run_tests.py
          python3 Tests/errors_test.py
          python3 Tests/sourcemap_test.py
          python3 Tests/env_test.py
          python3 Tests/portability_test.py
          python3 Tests/linux_extra_test.py
          python3 Tests/linux_more_test.py
          python3 Tests/linux_stress_test.py
          python3 Tests/floats_test.py
          python3 Tests/modules_test.py
      - name: Programs and C translator
        run: |
          python3 Tests/programs_test.py
          python3 Tests/c_test.py
      - name: Emulators
        run: |
          python3 Tests/chip8_test.py
          python3 Tests/gameboy_test.py
      - name: I/O and generated programs
        run: |
          python3 Tests/io_test.py
          python3 Tests/wayland_test.py
          python3 Tests/stress_test.py
      - name: Memory safety
        run: python3 Tests/bounds_test.py
      - name: Kernel boots (K1)
        run: python3 Tests/kernel_test.py || test $? -eq 77
      - name: Bootstrap and fixed point
        run: |
          python3 Tests/fixedpoint.py
          Tools/selfhost.sh --verify
